name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_state:
        description: 'Forzar borrado de estado (manual)'
        required: false
        type: boolean
        default: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # FASE 1: Levantar Infraestructura Base y Obtener DNS del ALB
  # ────────────────────────────────────────────────────────────────────────────
  infra-base:
    name: 🏗️ 1. Infraestructura Base
    runs-on: ubuntu-latest
    outputs:
      alb_dns: ${{ steps.alb_dns.outputs.DNS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Descargar el estado de la ejecución anterior
      - name: Download Previous Terraform State
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Buscando estado previo de Terraform..."
          gh run download --name terraform-state --dir terraform-aws || echo "No se encontró estado previo en GitHub."

      # Automatización Autocurativa: Detectar si cambió el Lab de AWS
      - name: Auto-Detect Lab Rotation (Self-Healing State)
        run: |
          STATE_FILE="terraform-aws/terraform.tfstate"
          if [ -f "$STATE_FILE" ]; then
            echo "Analizando coincidencia de cuenta de AWS en el estado previo..."
            
            # Extraer el primer ARN de AWS en el archivo de estado para obtener el Account ID anterior
            FIRST_ARN=$(grep -oE 'arn:aws:[a-zA-Z0-9._-]+:[a-z0-9-]+:[0-9]{12}:[a-zA-Z0-9._/-]+' "$STATE_FILE" | head -n 1 || true)
            
            if [ -n "$FIRST_ARN" ]; then
              STATE_ACCOUNT=$(echo "$FIRST_ARN" | cut -d':' -f5)
              CURRENT_ACCOUNT=$(aws sts get-caller-identity --query "Account" --output text)
              
              echo "Cuenta en estado previo: $STATE_ACCOUNT"
              echo "Cuenta activa del Lab:  $CURRENT_ACCOUNT"
              
              if [ "$STATE_ACCOUNT" != "$CURRENT_ACCOUNT" ] || [ "${{ github.event.inputs.clean_state }}" = "true" ]; then
                echo "⚠️ Se detectó un cambio de cuenta de AWS Academy o limpieza forzada."
                echo "Eliminando estado obsoleto para iniciar despliegue limpio en el nuevo laboratorio..."
                rm -f terraform-aws/terraform.tfstate terraform-aws/terraform.tfstate.backup
              else
                echo "✅ Las cuentas coinciden. Continuando con despliegue incremental sobre el mismo laboratorio."
              fi
            else
              echo "El archivo de estado no contiene recursos creados aún."
            fi
          else
            echo "No hay archivo de estado previo. Se iniciará un despliegue limpio."
          fi

      - name: Generate Base terraform.tfvars
        run: |
          cat <<EOF > terraform-aws/terraform.tfvars
          aws_region   = "us-east-1"
          project_name = "devcareer"
          environment  = "dev"
          
          vpc_cidr           = "10.0.0.0/16"
          availability_zones = ["us-east-1a", "us-east-1b"]
          public_subnets     = ["10.0.1.0/24", "10.0.2.0/24"]
          private_subnets    = ["10.0.10.0/24", "10.0.11.0/24"]
          database_subnets   = ["10.0.20.0/24", "10.0.21.0/24"]
          
          backend_image  = "hernang09/devcareer-backend:v2"
          
          frontend_cpu           = 256
          frontend_memory        = 512
          backend_cpu            = 256
          backend_memory         = 512
          frontend_desired_count = 1
          backend_desired_count  = 1
          
          port     = "3001"
          node_env = "production"
          
          dynamo_table_users      = "devcareer_users"
          dynamo_table_interviews = "devcareer_interviews"
          dynamo_table_feedback   = "devcareer_feedback"
          EOF

      - name: Terraform Init & Apply (Base)
        env:
          TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          TF_VAR_firebase_client_email: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          TF_VAR_firebase_private_key: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          TF_VAR_google_generative_ai_api_key: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          TF_VAR_next_public_firebase_api_key: ${{ secrets.FIREBASE_API_KEY }}
          TF_VAR_next_public_firebase_auth_domain: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          TF_VAR_next_public_firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          TF_VAR_next_public_firebase_storage_bucket: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TF_VAR_next_public_firebase_messaging_sender_id: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          TF_VAR_next_public_firebase_app_id: ${{ secrets.FIREBASE_APP_ID }}
          TF_VAR_next_public_firebase_measurement_id: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          TF_VAR_next_public_vapi_web_token: ${{ secrets.VAPI_WEB_TOKEN }}
          TF_VAR_next_public_vapi_workflow_id: ${{ secrets.VAPI_WORKFLOW_ID }}
        run: |
          cd terraform-aws
          terraform init
          terraform apply -auto-approve

      - name: Extract Frontend ALB DNS
        id: alb_dns
        run: |
          cd terraform-aws
          DNS=$(terraform output -raw frontend_alb_dns)
          echo "DNS=$DNS" >> $GITHUB_OUTPUT

      # Guardar el estado actual para pasarlo al siguiente Job
      - name: Upload Current State
        uses: actions/upload-artifact@v3
        with:
          name: terraform-state
          path: |
            terraform-aws/terraform.tfstate
            terraform-aws/terraform.tfstate.backup

  # ────────────────────────────────────────────────────────────────────────────
  # FASE 2: Build y Push de la Imagen Docker del Frontend
  # ────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: 🐳 2. Compilar & Subir Frontend
    runs-on: ubuntu-latest
    needs: infra-base
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devcareer-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ needs.infra-base.outputs.alb_dns }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_VAPI_WEB_TOKEN=${{ secrets.VAPI_WEB_TOKEN }}
            NEXT_PUBLIC_VAPI_WORKFLOW_ID=${{ secrets.VAPI_WORKFLOW_ID }}

  # ────────────────────────────────────────────────────────────────────────────
  # FASE 3: Actualizar ECS Fargate con la nueva versión del Frontend
  # ────────────────────────────────────────────────────────────────────────────
  deploy-ecs:
    name: 🚀 3. Redesplegar ECS Fargate
    runs-on: ubuntu-latest
    needs: [infra-base, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Descargar el estado transferido desde la Fase 1
      - name: Download State from Phase 1
        uses: actions/download-artifact@v3
        with:
          name: terraform-state
          path: terraform-aws/

      - name: Generate Base terraform.tfvars
        run: |
          cat <<EOF > terraform-aws/terraform.tfvars
          aws_region   = "us-east-1"
          project_name = "devcareer"
          environment  = "dev"
          
          vpc_cidr           = "10.0.0.0/16"
          availability_zones = ["us-east-1a", "us-east-1b"]
          public_subnets     = ["10.0.1.0/24", "10.0.2.0/24"]
          private_subnets    = ["10.0.10.0/24", "10.0.11.0/24"]
          database_subnets   = ["10.0.20.0/24", "10.0.21.0/24"]
          
          backend_image  = "hernang09/devcareer-backend:v2"
          
          frontend_cpu           = 256
          frontend_memory        = 512
          backend_cpu            = 256
          backend_memory         = 512
          frontend_desired_count = 1
          backend_desired_count  = 1
          
          port     = "3001"
          node_env = "production"
          
          dynamo_table_users      = "devcareer_users"
          dynamo_table_interviews = "devcareer_interviews"
          dynamo_table_feedback   = "devcareer_feedback"
          EOF

      - name: Terraform Apply (Final Update)
        env:
          TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          TF_VAR_firebase_client_email: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          TF_VAR_firebase_private_key: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          TF_VAR_google_generative_ai_api_key: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          TF_VAR_next_public_firebase_api_key: ${{ secrets.FIREBASE_API_KEY }}
          TF_VAR_next_public_firebase_auth_domain: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          TF_VAR_next_public_firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          TF_VAR_next_public_firebase_storage_bucket: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TF_VAR_next_public_firebase_messaging_sender_id: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          TF_VAR_next_public_firebase_app_id: ${{ secrets.FIREBASE_APP_ID }}
          TF_VAR_next_public_firebase_measurement_id: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          TF_VAR_next_public_vapi_web_token: ${{ secrets.VAPI_WEB_TOKEN }}
          TF_VAR_next_public_vapi_workflow_id: ${{ secrets.VAPI_WORKFLOW_ID }}
          TF_VAR_frontend_image: ${{ secrets.DOCKERHUB_USERNAME }}/devcareer-frontend:${{ github.sha }}
        run: |
          cd terraform-aws
          terraform apply -auto-approve

      # Subir el estado final definitivo
      - name: Upload Final State for Next Runs
        uses: actions/upload-artifact@v3
        with:
          name: terraform-state
          path: |
            terraform-aws/terraform.tfstate
            terraform-aws/terraform.tfstate.backup
